name: BTC Monitor

on:
  workflow_dispatch: {}   # disparado pelo Cloudflare (cron externo) + permite rodar manual pela aba "Actions"

permissions:
  contents: write   # necessario para o job commitar o log/status atualizados

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar checagem (sem dependencias externas)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor/fetch_and_check.py

      - name: Commitar log/status/state atualizados
        run: |
          git config user.name "btc-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add claude/log-monitoramento-btc-auto.md claude/status-simulacao.md monitor/state.json
          git diff --cached --quiet || git commit -m "Atualiza monitoramento BTC ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
