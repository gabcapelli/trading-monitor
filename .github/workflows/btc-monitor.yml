name: BTC Monitor

on:
  workflow_dispatch: {}   # disparado pelo Cloudflare (cron externo) + permite rodar manual pela aba "Actions"

permissions:
  contents: write   # necessario para o job commitar o log/status atualizados

# Uma execucao por vez: se o GitHub atrasar uma (incidente de 05/10/2026: 73 min na
# fila), a seguinte espera em vez de rodar em paralelo e brigar no push.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          ref: main   # o estado mais novo na hora em que roda, nao o do disparo (execucao atrasada usava dados velhos)

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar checagem (sem dependencias externas)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor/fetch_and_check.py

      - name: Checar a fapi/proxy (avisa no ntfy se cair; nunca bloqueia)
        continue-on-error: true
        timeout-minutes: 5
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UNLOCK_PAPER_FAPI: ${{ secrets.UNLOCK_PAPER_FAPI }}
        run: python monitor/saude_fontes.py

      - name: Registrar sabado em papel (idempotente; so grava apos um sabado novo)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UNLOCK_PAPER_FAPI: ${{ secrets.UNLOCK_PAPER_FAPI }}   # precos via unlock_paper.py (proxy-vercel/api/fapi.js)
        run: python monitor/sabado_paper.py

      - name: Registrar desbloqueios em papel (idempotente; calendario 1x por dia)
        continue-on-error: true   # falha aqui (DefiLlama/Binance fora) nunca bloqueia o commit do monitor
        timeout-minutes: 15
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UNLOCK_PAPER_FAPI: ${{ secrets.UNLOCK_PAPER_FAPI }}   # proxy-vercel/api/fapi.js; vazio = fapi direta (451 nos EUA)
        run: python monitor/unlock_paper.py

      - name: Registrar perpetuos novos em papel (idempotente; varredura 1x por dia)
        continue-on-error: true   # falha aqui nunca bloqueia o commit do monitor
        timeout-minutes: 15
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UNLOCK_PAPER_FAPI: ${{ secrets.UNLOCK_PAPER_FAPI }}   # proxy-vercel/api/fapi.js; vazio = fapi direta (451 nos EUA)
        run: python monitor/novos_paper.py

      - name: Registrar Monitoring Tag em papel (le o feed de anuncios a cada hora)
        continue-on-error: true   # falha aqui nunca bloqueia o commit do monitor
        timeout-minutes: 10
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UNLOCK_PAPER_FAPI: ${{ secrets.UNLOCK_PAPER_FAPI }}   # fapi e rota /cms do proxy-vercel
        run: python monitor/monitoring_paper.py

      - name: Registrar rompimento 48h no top 20 em papel (estudo 46; barras de 4h)
        continue-on-error: true   # falha aqui nunca bloqueia o commit do monitor
        timeout-minutes: 10
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UNLOCK_PAPER_FAPI: ${{ secrets.UNLOCK_PAPER_FAPI }}   # fapi (com ticker/24hr) do proxy-vercel
        run: python monitor/continuacao_paper.py

      - name: Atualizar painel (README.md; le os estados gravados acima + preco atual dos abertos)
        continue-on-error: true   # falha aqui nunca bloqueia o commit do monitor
        env:
          UNLOCK_PAPER_FAPI: ${{ secrets.UNLOCK_PAPER_FAPI }}   # ticker/24hr via proxy-vercel; sem ele, so sem preco atual
        run: python monitor/painel.py

      - name: Commitar log/status/state atualizados
        run: |
          git config user.name "btc-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add claude/log-monitoramento-btc-auto.md claude/status-simulacao.md claude/sinais.md claude/calibracao.md monitor/state.json claude/trade_journal.db claude/sabado-paper.md monitor/sabado_paper_state.json claude/unlock-paper.md monitor/unlock_paper_state.json monitor/unlock_paper_protocolos.json claude/novos-paper.md monitor/novos_paper_state.json monitor/saude_fontes.json claude/monitoring-paper.md monitor/monitoring_paper_state.json claude/continuacao-paper.md monitor/continuacao_paper_state.json README.md
          git rm --ignore-unmatch claude/candidatos-pendentes.md
          git diff --cached --quiet || git commit -m "Atualiza monitoramento BTC ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main && git push   # se outra execucao gravou no meio tempo
